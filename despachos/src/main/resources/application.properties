spring.application.name=servicio-despachos
server.port=8097
spring.datasource.url=jdbc:mysql://localhost:3306/db_lart_despachos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACIÓN SWAGGER 
springdoc.api-docs.path=/api/despachos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# APAGAR REPORTE INFINITO DE CONDICIONES DE ERROR DE LA CONSOLA
logging.level.org.springframework.boot.autoconfigure=ERROR