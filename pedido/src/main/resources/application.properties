spring.application.name=service-pedidos
server.port=8094
# Conexión a DB Pedidos
spring.datasource.url=jdbc:mysql://localhost:3306/db_lart_pedidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Ruta donde se generará el JSON de la documentación (Ajustado a tus pedidos)
springdoc.api-docs.path=/pedidos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Indicar a Spring que respete los encabezados X-Forwarded (Host, Port, Proto)
server.forward-headers-strategy=framework

# Ayuda a SpringDoc a entender que hay un prefijo desde el Gateway para tus pedidos
springdoc.webjars.prefix=/pedidos
# Fuerza a SpringDoc a usar las cabeceras X-Forwarded
springdoc.use-management-port=false
springdoc.show-actuator=false

# Configuración de Tomcat para interceptar las cabeceras del Gateway correctamente
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.port-header=x-forwarded-port