spring.application.name=proyecto
server.port=8091

spring.datasource.url=jdbc:mysql://localhost:3306/db_lart_clientes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ajuste Swagger para Clientes
springdoc.api-docs.path=/clientes/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework
springdoc.webjars.prefix=/clientes