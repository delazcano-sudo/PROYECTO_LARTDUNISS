spring.application.name=service-productos
# Usamos el puerto 8092 asi no choca con el otro puerto que usamos en Clientes
server.port=8092

# Configuración de base de datos para Productos
spring.datasource.url=jdbc:mysql://localhost:3306/db_lart_productos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate para crear las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true