spring.application.name=service-productos
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3306/db_lart_productos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ajuste Swagger
springdoc.api-docs.path=/productos/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
server.forward-headers-strategy=framework
springdoc.webjars.prefix=/productos