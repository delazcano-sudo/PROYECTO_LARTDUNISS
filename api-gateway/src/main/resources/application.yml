server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: clientes-service
          uri: http://localhost:8091
          predicates:
            - Path=/clientes/**
        - id: productos-service
          uri: http://localhost:8092
          predicates:
            - Path=/productos/**
        - id: pagos-service
          uri: http://localhost:8093
          predicates:
            - Path=/pagos/**
        - id: pedidos-service
          uri: http://localhost:8094
          predicates:
            - Path=/pedidos/**
        - id: usuarios-service
          uri: http://localhost:8095
          predicates:
            - Path=/usuarios/**
